<div style="font-family:Arial,sans-serif;background:#080820;padding:24px">
  <div style="max-width:480px;margin:auto;background:#1a1542;border:3px solid #4a46d6;border-radius:18px;padding:28px;color:#fff;text-align:center">
    <h1 style="margin:0 0 8px;color:#a5a0ff;font-size:24px">Oi, {{ user.get_username }}!</h1>
    <p style="color:#c8d0dc;line-height:1.5">Recebemos um pedido para redefinir a senha da sua conta no Oink.</p>
    <p style="margin:24px 0"><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="background:#5b14f0;color:#fff;text-decoration:none;padding:14px 28px;border-radius:12px;font-weight:bold">Criar nova senha</a></p>
    <p style="color:#c8d0dc;font-size:13px">O link vale por 1 hora. Se não foi você, ignore este e-mail: sua senha continua a mesma.</p>
  </div>
</div>
