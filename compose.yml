
services:
  django:
    build:
      context: .
      dockerfile: docker/django-dockerfile
    container_name: django
    working_dir: /var/www/
    volumes:
      - python_venv:/var/www/.venv
      - ./app:/var/www/
    networks:
      - oink_net
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

  db:
    image: mysql:8.4
    container_name: db
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - oink_net
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: oink_db
      MYSQL_USER: user
      MYSQL_PASSWORD: senha
    healthcheck:
      test: mysql --user=root --password=123456 --execute="SHOW DATABASES;"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  python_venv:
  db_data:

networks:
  oink_net:


